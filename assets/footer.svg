<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="Vamos codar juntos">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d9d" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ff4d9d"/>
      <stop offset="0.65" stop-color="#b57bff"/>
      <stop offset="1" stop-color="#b57bff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="100" y="12" width="800" height="2" rx="1" fill="url(#line)"/>
  <text x="500" y="52" text-anchor="middle" class="mono" font-size="20" fill="#e0569f">vamos codar juntos<tspan class="cursor">_</tspan></text>
</svg>
