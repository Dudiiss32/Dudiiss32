<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Maria Eduarda Weber, Software Engineer e Desenvolvedora Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16101d"/>
      <stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="0.5" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d9d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#b57bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="320" rx="28"/>
    </clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .blob-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .blob-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.55s; }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(70px, 30px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-80px, -25px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .blob-a, .blob-b, .cursor, .pulse { animation: none; }
      .rise { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <circle class="blob-a" cx="150" cy="60" r="150" fill="#ff4d9d" fill-opacity="0.38" filter="url(#blur)"/>
    <circle class="blob-b" cx="880" cy="290" r="170" fill="#8b5cf6" fill-opacity="0.36" filter="url(#blur)"/>
    <rect width="1000" height="320" fill="url(#dots)"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="318.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- selo -->
  <g class="rise">
    <rect x="346" y="54" width="308" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle class="pulse" cx="370" cy="73" r="5" fill="#4ade80"/>
    <text x="508" y="79" text-anchor="middle" class="sans" font-size="16" font-weight="600" letter-spacing="0.4" fill="#f2e9f5">Software Engineer · HOS Sistemas</text>
  </g>

  <!-- nome -->
  <g class="rise d1">
    <text x="500" y="176" text-anchor="middle" class="sans" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">Maria Eduarda <tspan fill="url(#name)">Weber</tspan></text>
  </g>

  <rect class="rise d2" x="350" y="204" width="300" height="2" rx="1" fill="url(#line)"/>

  <!-- subtítulo -->
  <g class="rise d3">
    <text x="500" y="254" text-anchor="middle" class="mono" font-size="24" fill="#cfc3d8"><tspan fill="#ff7ab8">&gt;</tspan> desenvolvedora full stack<tspan class="cursor" fill="#ff7ab8">_</tspan></text>
  </g>
</svg>
